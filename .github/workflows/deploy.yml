name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Education dependencies
        working-directory: ./my-portfolio
        run: npm install

      - name: Build Education
        working-directory: ./my-portfolio
        run: npm run build

      - name: Install JustLepsPhotos dependencies
        working-directory: ./just-leps-photos
        run: npm install

      - name: Build JustLepsPhotos
        working-directory: ./just-leps-photos
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p site/Education site/JustLepsPhotos
          cp -r my-portfolio/dist/. site/Education/
          cp -r just-leps-photos/dist/. site/JustLepsPhotos/
          cp site-root/index.html site/index.html
          cp site-root/404.html site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
