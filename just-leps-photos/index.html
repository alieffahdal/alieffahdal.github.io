<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restore the real path saved by the site-root 404.html redirect
      // (see /site-root/404.html) before React Router mounts.
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JustLeps Photos - a personal photography portfolio" />
    <title>JustLeps Photos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
