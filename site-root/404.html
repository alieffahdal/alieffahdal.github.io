<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages only serves one 404.html (this one, at the site root),
      // so a deep link inside a sub-app (e.g. /JustLepsPhotos/discover)
      // lands here instead of that app's own client-side router. If the
      // path belongs to a known app, hand it back to that app's index.html
      // and let it restore the real path before its router mounts.
      (function () {
        var path = location.pathname + location.search + location.hash;
        var apps = ["/Education/", "/JustLepsPhotos/"];
        for (var i = 0; i < apps.length; i++) {
          if (path.indexOf(apps[i]) === 0) {
            sessionStorage.setItem("spa-redirect", path);
            location.replace(apps[i]);
            return;
          }
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0d;
        color: #f2f2f0;
        font-family: "Helvetica Neue", Arial, sans-serif;
        padding: 2rem;
      }
      main {
        max-width: 640px;
        text-align: center;
      }
      .code {
        font-size: 3rem;
        font-weight: 800;
        color: #f6ad55;
        margin: 0;
      }
      p {
        color: #a1a1aa;
        margin: 0.75rem 0 2rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }
      a.card {
        flex: 1 1 220px;
        display: block;
        padding: 1.25rem;
        border: 1px solid #2a2a2f;
        border-radius: 14px;
        color: inherit;
        text-decoration: none;
        font-weight: 600;
      }
      a.card:hover {
        border-color: #f6ad55;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <p>This page doesn't exist. Try one of the sites below.</p>
      <div class="links">
        <a class="card" href="/Education/">Education Portfolio →</a>
        <a class="card" href="/JustLepsPhotos/">JustLeps Photos →</a>
      </div>
    </main>
  </body>
</html>
